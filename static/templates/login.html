<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/PulsoCM/static/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="/PulsoCM/static/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    
    <title>Login</title>
</head>

<body>
    <main>
        <div class="forms-login">
            <form id="login-form">
                <h1>Login</h1>

                <div class="input-group">
                    <div class="input-box">
                        <label for="email"><p class="paragrafo">Email</p></label>
                        <input type="email" placeholder="Digite seu email">
                    </div>

                    <div class="input-box">
                        <label for="password"><p class="paragrafo">Senha</p></label>
                        <input type="password" maxlength="6" placeholder="Digite sua senha">
                    </div>
                </div>

                <div class="login-button">
                    <button type="submit"><a href="/PulsoCM/static/templates/logado.html"></a><p>Entrar</p></button> 
                </div>

                <!--fazendo a página home logado aparecer após 2seg-->
                <p id="mensagem" style="display: none;">Aguarde...</p> 
                <script src="/PulsoCM/static/javascript/delay.js"></script>
                <!--fim codigo do delay-->
                
                <div class="login-button">
                    <button><a href="/PulsoCM/static/templates/cadastro.html"></a><p>Realizar cadastro</p></button> 
                </div>

                <div class="senha-nova">
                    <a href="/PulsoCM/static/templates/senhaNova.html">Esqueci minha senha</a> 
                </div>

                <!-- Mensagem de Erro ou Sucesso -->
                <div id="message" style="color: red;"></div>
            </form>
        </div>
    </main>


     <!-- //Adicionar Firebase SDK -->
     <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
     <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
     
     <script>
         // Configuração do Firebase
         const firebaseConfig = {
            apiKey: "AIzaSyCMCR42h8ZM4ao4D5MSTZkg99PIhspSAZE",
            authDomain: "pulso-da-historia.firebaseapp.com",
            databaseURL: "https://pulso-da-historia-default-rtdb.firebaseio.com",
            projectId: "pulso-da-historia",
            storageBucket: "pulso-da-historia.appspot.com",
            messagingSenderId: "285634655113",
            appId: "1:285634655113:web:7e97210e9c6b2878d96758"
        };
        
         //Firebase
         firebase.initializeApp(firebaseConfig);
 
         // identificação do formulário de login e  mensagem de erro ou de sucesso
         const loginForm = document.getElementById('login-form');
         const messageDiv = document.getElementById('message');
         const mensagemAguarde = document.getElementById('mensagem');
 
         loginForm.addEventListener('submit', (e) => {
             e.preventDefault();
 
             const email = document.getElementById('email').value.trim();
             const password = document.getElementById('password').value;
 
             mensagemAguarde.style.display = 'block';
             messageDiv.textContent = '';

             firebase.auth().signInWithEmailAndPassword(email, password)
                .then(userCredential => {
                    const user = userCredential.user;
                    console.log('Login realizado com sucesso:', user);
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = 'Login realizado com sucesso! Redirecionando...';

                    setTimeout(() => {
                        window.location.href = "/templates/logado.html";
                    }, 2000);
                })
                .catch(error => {
                    mensagemAguarde.style.display = 'none';
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = 'Erro no login: ' + error.message;
                });
         });
     </script>
</body>
</html>
